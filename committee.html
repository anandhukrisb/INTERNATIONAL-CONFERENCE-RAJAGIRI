  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fdfbf7;
      font-family: "Inter", system-ui, sans-serif;
      color: #333;
    }

    .committee-section {
      max-width: 95%;
      margin: 80px auto 0;
      padding: 40px 20px 0;
    }

    .section-title {
      font-family: "Outfit", sans-serif;
      font-size: 2rem;
      color: #1d0a3f;
      margin-bottom: 40px;
      font-weight: 600;
    }

    .section-title::after {
      content: "";
      width: 80px;
      height: 4px;
      background: #c9a227;
      display: block;
      margin-top: 10px;
      border-radius: 3px;
    }

    /* GRID */
    .committee-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      column-gap: 20px;
      row-gap: 50px;
      margin-bottom: 80px;
    }

    /* CARD */
    .committee-card {
      background: #1d0a3f;
      color: #fff;
      border-radius: 12px;
      border-left: 6px solid #c9a227;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);

      display: flex;
      flex-direction: column;

      min-height: 360px;
      transition: transform 0.6s cubic-bezier(0.79, -0.01, 0, 0.99),
        box-shadow 0.6s ease;
    }

    .committee-card:hover {
      transform: scale(1.05);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
    }

    .card-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 30px 20px 10px;
      justify-content: center;
      flex: 1;
    }

    .card-header img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .card-header h3 {
      margin: 8px 0 4px;
      font-size: 1.05rem;
    }

    .card-header h4 {
      margin: 0;
      font-size: 0.85rem;
      color: #c9a227;
      font-weight: 400;
    }

    .card-footer {
      margin-top: auto;
      padding: 0px 0px 50px;
      text-align: center;
    }

    .toggle-btn {
      background: #c9a227;
      color: #1d0a3f;
      border: none;
      padding: 15px 35px;
      border-radius: 50px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      text-transform: capitalize;
      letter-spacing: normal;
      transition: transform 0.3s ease;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .toggle-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
      z-index: -1;
      transition: clip-path 0.4s ease-out;
      clip-path: circle(0% at 0 50%);
    }

    .toggle-btn:hover::before {
      clip-path: circle(150% at 0 50%);
    }

    .toggle-btn:hover {
      transform: translateY(-3px);
      color: #1d0a3f;
    }

    .toggle-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .toggle-btn:disabled::before {
      display: none;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 9999;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #1d0a3f;
      color: #fff;
      width: 90%;
      max-width: 650px;
      border-radius: 16px;
      padding: 30px;
      position: relative;

      transform: translateY(100vh);
      opacity: 0;
      transition:
        transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.5s ease;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
      opacity: 1;
    }

    /* CLOSE BUTTON */
    .modal-close {
      position: absolute;
      top: 15px;
      right: 18px;
      font-size: 26px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      transition: transform 0.4s ease, color 0.4s ease;
    }

    .modal-close:hover {
      transform: rotate(90deg);
      color: #c9a227;
    }

    .modal-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .modal-header img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      margin-bottom: 15px;
      object-fit: cover;
      object-position: center;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.3rem;
    }

    .modal-header h4 {
      margin-top: 6px;
      color: #c9a227;
      font-weight: 400;
    }

    .modal-body {
      font-size: 0.95rem;
      line-height: 1.7;
      text-align: justify;
    }

    /* TABLET VIEW */
    @media (min-width: 769px) and (max-width: 992px) {
      .committee-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* MOBILE VIEW */
    @media (max-width: 768px) {
      .committee-grid {
        grid-template-columns: 1fr;
        justify-items: center;
        /* Center align cards */
      }

      .committee-card {
        width: 100%;
        max-width: 380px;
        /* Constrain width for better mobile look */
      }

      .committee-card:hover {
        transform: none;
      }
    }
  </style>

  function renderCards(data, containerId) {

    const modal = document.getElementById("profileModal");

    document.addEventListener("click", e => {

        modal.classList.add("active");
        document.body.style.overflow = "hidden";
        modal.querySelector("#modalImage").src = e.target.dataset.img;
        modal.querySelector("#modalName").textContent = e.target.dataset.name;

        setTimeout(() => {
          document.body.style.overflow = "";
        }, 500);
