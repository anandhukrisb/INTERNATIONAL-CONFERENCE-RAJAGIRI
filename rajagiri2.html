<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajagiri | 2027 ICSWHMH</title>
    <link rel="icon" type="image/x-icon" href="assets/Favicon-192.ico?v=2">
    <script src="navbar.js" defer></script>
    <script src="footer.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">

    <!-- View Transitions API CSS -->
    <style>
        /* Bouncing Ball Loader */
        #page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #FDFBF7;
            z-index: 1000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease-out;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .ball-wrapper {
            width: 100px;
            height: 100px;
            position: relative;
            margin-bottom: 20px;
        }

        .ball {
            width: 40px;
            height: 40px;
            background-color: #1D0A3F;
            border-radius: 50%;
            position: absolute;
            left: 30px;
            /* Center horizontally in 100px wrapper (100-40)/2 */
            top: 0;
            animation: bounce 0.6s infinite alternate cubic-bezier(0.4, 0, 1, 1);
        }

        .shadow {
            width: 40px;
            height: 10px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            left: 30px;
            animation: shadow-pulse 0.6s infinite alternate cubic-bezier(0.4, 0, 1, 1);
        }

        @keyframes bounce {
            0% {
                transform: translateY(0) scale(1.1, 0.9);
                /* Squash at bottom */
            }

            100% {
                transform: translateY(-60px) scale(0.9, 1.1);
                /* Stretch at top */
            }
        }

        @keyframes shadow-pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            100% {
                transform: scale(0.6);
                opacity: 0.2;
            }
        }

        .loader-text {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            color: #1D0A3F;
            letter-spacing: 1px;
            animation: pulse 1.5s ease-in-out infinite;
            margin-top: 10px;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        /* Prevent navbar and footer from flickering during transitions */
        floating-navbar {
            view-transition-name: navbar;
        }

        main-footer {
            view-transition-name: footer;
        }

        /* Smooth crossfade animation for page content */
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: 0.3s;
        }

        /* Keep navbar and footer stable (no animation) */
        ::view-transition-old(navbar),
        ::view-transition-new(navbar),
        ::view-transition-old(footer),
        ::view-transition-new(footer) {
            animation: none;
        }

        /* Respect user's motion preferences */
        @media (prefers-reduced-motion: reduce) {

            ::view-transition-old(root),
            ::view-transition-new(root) {
                animation: none !important;
            }
        }
    </style>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html {
            overflow-x: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #FDFBF7;
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            /* Sticky Footer Setup */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            width: 100%;
        }

        /* Floating Navbar Component */
        floating-navbar {
            display: block;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        main {
            padding-top: 150px;
            padding-left: 20px;
            padding-right: 20px;
            max-width: 1200px;
            margin: 0 auto;
            flex: 1;
            /* Push footer down */
            width: 100%;
        }
    </style>
</head>

<body>
    <!-- Page Loader -->
    <div id="page-loader">
        <div class="loader-content">
            <div class="ball-wrapper">
                <div class="shadow"></div>
                <div class="ball"></div>
            </div>
            <div class="loader-text">LOADING</div>
        </div>
    </div>

    <floating-navbar></floating-navbar>

    <main>
        <h1>Rajagiri content goes here</h1>
    </main>

    <main-footer></main-footer>

    <script>
        // Loader Script
        window.addEventListener('load', () => {
            const loader = document.getElementById('page-loader');
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    document.body.classList.remove('loading');
                }, 500);
            }, 500);
        });
    </script>
</body>

</html>
