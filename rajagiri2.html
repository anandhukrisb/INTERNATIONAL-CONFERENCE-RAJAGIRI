<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajagiri | 2027 ICSWHMH</title>
    <link rel="icon" type="image/x-icon" href="assets/Favicon-192.ico?v=2">
    <script src="navbar.js" defer></script>
    <script src="footer.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">

    <!-- View Transitions API CSS -->
    <style>
        /* Bouncing Ball Loader */
        #page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #FDFBF7;
            z-index: 1000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease-out;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .ball-wrapper {
            width: 100px;
            height: 100px;
            position: relative;
            margin-bottom: 20px;
        }

        .ball {
            width: 40px;
            height: 40px;
            background-color: #1D0A3F;
            border-radius: 50%;
            position: absolute;
            left: 30px;
            /* Center horizontally in 100px wrapper (100-40)/2 */
            top: 0;
            animation: bounce 0.6s infinite alternate cubic-bezier(0.4, 0, 1, 1);
        }

        .shadow {
            width: 40px;
            height: 10px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            left: 30px;
            animation: shadow-pulse 0.6s infinite alternate cubic-bezier(0.4, 0, 1, 1);
        }

        @keyframes bounce {
            0% {
                transform: translateY(0) scale(1.1, 0.9);
                /* Squash at bottom */
            }

            100% {
                transform: translateY(-60px) scale(0.9, 1.1);
                /* Stretch at top */
            }
        }

        @keyframes shadow-pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            100% {
                transform: scale(0.6);
                opacity: 0.2;
            }
        }

        .loader-text {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            color: #1D0A3F;
            letter-spacing: 1px;
            animation: pulse 1.5s ease-in-out infinite;
            margin-top: 10px;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        /* Prevent navbar and footer from flickering during transitions */
        floating-navbar {
            view-transition-name: navbar;
        }

        main-footer {
            view-transition-name: footer;
        }

        /* Smooth crossfade animation for page content */
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: 0.3s;
        }

        /* Keep navbar and footer stable (no animation) */
        ::view-transition-old(navbar),
        ::view-transition-new(navbar),
        ::view-transition-old(footer),
        ::view-transition-new(footer) {
            animation: none;
        }

        /* Respect user's motion preferences */
        @media (prefers-reduced-motion: reduce) {

            ::view-transition-old(root),
            ::view-transition-new(root) {
                animation: none !important;
            }
        }
    </style>

    <style>
        /* Rajagiri Hero Section Styles */
        .rajagiri-hero-section {
            width: 95vw;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            padding-bottom: 50px;
        }

        .rajagiri-hero-container {
            width: 100%;
            height: 65vh;
            /* Decreased height */
            min-height: 500px;
            /* Reduced min-height */
            border-radius: 40px;
            /* Full Primary background with larger Radial Highlight */
            background: radial-gradient(circle at 50% 100%, #4B2C7A 20%, #1D0A3F 80%);
            position: relative;
            overflow: hidden;
            /* Or visible if image needs to pop out */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            transition: background 1s ease;
        }

        /* Top Left: Name */
        .raj-hero-name {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 5;
            text-align: left;
        }

        .raj-hero-name h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #FFFFFF;
            /* White on primary */
            margin: 0;
            line-height: 1.2;
        }

        /* Top Right: Designation */
        .raj-hero-designation {
            position: absolute;
            top: 40px;
            right: 40px;
            z-index: 5;
            text-align: right;
            max-width: 300px;
        }

        .raj-hero-designation p {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: #FFFFFF;
            /* White on primary */
            margin: 0;
        }

        /* Center: Image */
        .raj-hero-image-wrapper {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 100%;
            /* Top of image at top of container */
            z-index: 10;
            display: flex;
            align-items: flex-end;
            pointer-events: none;
            /* Let clicks pass through if needed */
        }

        .raj-hero-image {
            height: 100%;
            /* Fill the wrapper to reach top */
            width: auto;
            object-fit: cover;
            /* or contain */
            display: block;
            /* Filter for shadow if needed */
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        /* Bottom Right: Small Card */
        .raj-hero-card {
            position: absolute;
            bottom: 40px;
            right: 40px;
            z-index: 15;
            /* Above background, mostly above image if overlap */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 20px;
            width: 250px;
            color: #FFFFFF;
        }

        .raj-hero-card h4 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0 0 5px 0;
            color: #C9A227;
            /* Gold accent */
        }

        .raj-hero-card p {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            margin: 0;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.4;
        }

        /* Bottom Left Placeholder */
        .raj-hero-placeholder {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 15;
        }

        /* Mobile Responsiveness */
        @media (max-width: 900px) {
            .rajagiri-hero-container {
                height: auto;
                min-height: 700px;
                background: linear-gradient(to top, #1D0A3F 60%, #FDFBF7 60%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-end;
                padding-top: 100px;
                /* Space for name/designation */
            }

            .raj-hero-name {
                top: 20px;
                left: 20px;
                text-align: center;
                width: 100%;
                left: 0;
            }

            .raj-hero-designation {
                top: 60px;
                right: auto;
                left: 0;
                width: 100%;
                text-align: center;
                max-width: 100%;
            }

            .raj-hero-image-wrapper {
                position: relative;
                left: auto;
                transform: none;
                height: 400px;
                width: 100%;
                justify-content: center;
                margin-top: auto;
            }

            .raj-hero-card {
                position: relative;
                bottom: auto;
                right: auto;
                margin-top: 20px;
                margin-bottom: 20px;
                width: 90%;
            }

            .raj-hero-placeholder {
                display: none;
            }
        }

        /* Slider Image Styles */
        .raj-slider-images {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .raj-slide-image-wrapper {
            position: absolute;
            bottom: 0;
            left: 50%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            transition: all 1s cubic-bezier(0.19, 1, 0.22, 1);
            /* Smooth eased transition */
            opacity: 0;
            transform-origin: bottom center;
        }

        .raj-slide-image {
            height: 100%;
            width: auto;
            object-fit: cover;
            display: block;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        /* Animation States */

        /* Active: Center, Full Scale */
        .slide-active {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            left: 50%;
        }

        /* Enter: From Bottom Right, Scale 0 */
        .slide-enter {
            opacity: 0;
            transform: translate(50%, 50%) scale(0.5);
            /* Start slightly larger than 0 for better visibility */
            left: 80%;
            /* Start from right */
        }

        /* Exit: To Left, Scale Down */
        .slide-exit {
            opacity: 0;
            transform: translate(-150%, 20%) scale(0.5);
            left: 20%;
        }

        /* Text Transitions */
        .raj-hero-name,
        .raj-hero-designation,
        .raj-hero-card {
            transition: opacity 0.5s ease;
        }

        /* Navigation Arrows */
        .raj-hero-prev,
        .raj-hero-next {
            z-index: 500;
            position: absolute;
            width: 40px;
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.3s ease;
            top: 50%;
        }

        .raj-hero-prev:hover,
        .raj-hero-next:hover {
            opacity: 1;
        }

        .raj-hero-prev {
            left: 20px;
            transform: translateY(-50%);
        }

        .raj-hero-next {
            right: 20px;
            transform: translateY(-50%);
        }

        /* Background Watermarks */
        .raj-watermark-left,
        .raj-watermark-right {
            position: absolute;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.05);
            /* Low opacity */
            z-index: 1;
            /* Behind slider (10) and text (5) - Wait, text is 5? No text is 5. Slider is 10? 
                           If slider is 10, watermark at 1 is behind slider image? 
                           Yes, user said "appear in the background". 
                           But if slider image is opaque, it will cover it. 
                           The slider image moves. 
                           If slider image covers the whole center, background text might be hidden. 
                           However, slider images are centered and might not cover full width/height or have transparency? 
                           No, they are object-fit: cover. 
                           User said "in the background". 
                           If it's behind the image, it's only visible if image is not full width. 
                           The image is `left: 50%` and `transform: translateX(-50%)`. 
                           It might not cover the sides.
                           Let's stick to z-index 1. */
            pointer-events: none;
            white-space: nowrap;
            line-height: 1;
        }

        .raj-watermark-left {
            font-size: 15rem;
            /* Very large */
            left: -50px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            /* Maybe vertical? "on the left" */
            /* User said "on the left". Usually vertical or just big background. 
               Let's make it vertical for style or just huge horizontal. 
               "saying rajagiri on the left". 
               Let's try vertical rotation to fit nicely on the side. */
            transform-origin: center;
        }

        /* Re-reading request: "text saying rajagirion the left and at the right a bit bottom, there should be a text saing lern serve excel" 
           Let's standard placement without rotation first, maybe just huge text. 
           Actually, vertical usually looks cleaner for "side" text. 
           But let's stick to horizontal if it fits? RAJAGIRI is short. 
           Let's rotate -90deg for left side pillar look. */

        .raj-watermark-left {
            font-size: 8rem;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            /* If it's too wide, it will overlap image. 
               Let's try rotating it. */
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: translateY(-50%) rotate(180deg);
            /* 180 to read bottom up? or 0? 
                                                           vertical-rl reads top-to-bottom usually. 
                                                           Let's use rotation. */
        }

        .raj-watermark-left {
            font-size: 8rem;
            /* Adjusted slightly */
            left: 40px;
            top: 150px;
            /* A bit to the top */
            transform: none;
            /* No rotation */
            writing-mode: initial;
        }

        .raj-watermark-right {
            font-size: 4rem;
            right: 40px;
            bottom: 150px;
            /* "a bit bottom" - avoiding card area */
            text-align: right;
        }

        /* Adjust sliding images to not cover watermarks if possible, 
           or watermarks are BEHIND images. 
           The image is centered. 
           If watermark is z-index 1 and image is 10, image covers watermark. 
           This is expected for "background". */
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const slidesData = [
                {
                    name: "Dr. Saju M.D.",
                    designation: "Principal, Rajagiri College of Social Sciences",
                    image: "assets/ceo_image.png",
                    cardTitle: "Visionary Leadership",
                    cardText: "Driving excellence in education and social commitment.",
                    gradient: "radial-gradient(circle at 50% 100%, #4B2C7A 20%, #1D0A3F 80%)" // Purple (Original)
                },
                {
                    name: "Fr. Dr. Jose Kuriedath",
                    designation: "Director, Rajagiri Institutions",
                    image: "assets/ceo_image.png",
                    cardTitle: "Academic Excellence",
                    cardText: "Fostering a culture of learning and innovation.",
                    gradient: "radial-gradient(circle at 50% 100%, #2C4B7A 20%, #0A1D3F 80%)" // Deep Blue
                },
                {
                    name: "Dr. Binoy Joseph",
                    designation: "Associate Director",
                    image: "assets/ceo_image.png",
                    cardTitle: "Global Perspective",
                    cardText: "Connecting local values with global opportunities.",
                    gradient: "radial-gradient(circle at 50% 100%, #7A2C4B 20%, #3F0A1D 80%)" // Deep Maroon/Burgundy
                }
            ];

            let currentIndex = 0;
            let slideInterval;
            const container = document.getElementById('heroImages');
            // We need the *hero container* to change BG, not just image container
            const heroWrapper = document.querySelector('.rajagiri-hero-container');
            const nameEl = document.getElementById('heroName');
            const desigEl = document.getElementById('heroDesignation');
            const cardEl = document.getElementById('heroCard');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            // Initial Layout
            function initSlider() {
                // Create image elements
                slidesData.forEach((slide, index) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = `raj-slide-image-wrapper ${index === 0 ? 'slide-active' : 'slide-enter'}`;
                    // Move others to 'enter' state initially (hidden bottom right)

                    const img = document.createElement('img');
                    img.src = slide.image;
                    img.className = 'raj-slide-image';
                    img.alt = slide.name;

                    wrapper.appendChild(img);
                    container.appendChild(wrapper);
                });

                updateText(0, false);

                // Start Loop
                startAutoSlide();

                // Event Listeners
                prevBtn.addEventListener('click', () => {
                    prevSlide();
                    resetAutoSlide();
                });

                nextBtn.addEventListener('click', () => {
                    nextSlide();
                    resetAutoSlide();
                });
            }

            function startAutoSlide() {
                slideInterval = setInterval(nextSlide, 3000); // Reduced to 3 seconds
            }

            function resetAutoSlide() {
                clearInterval(slideInterval);
                startAutoSlide();
            }

            function updateText(index, animate = true) {
                const data = slidesData[index];

                // Background update
                if (heroWrapper) {
                    heroWrapper.style.background = data.gradient;
                }

                const updateContent = () => {
                    nameEl.innerHTML = `<h3>${data.name}</h3>`;
                    desigEl.innerHTML = `<p>${data.designation}</p>`;
                    cardEl.innerHTML = `<h4>${data.cardTitle}</h4><p>${data.cardText}</p>`;
                };

                if (animate) {
                    // Fade Out
                    nameEl.style.opacity = '0';
                    desigEl.style.opacity = '0';
                    cardEl.style.opacity = '0';

                    setTimeout(() => {
                        updateContent();
                        // Fade In
                        nameEl.style.opacity = '1';
                        desigEl.style.opacity = '1';
                        cardEl.style.opacity = '1';
                    }, 500); // Wait for fade out
                } else {
                    updateContent();
                }
            }

            function nextSlide() {
                const slides = document.querySelectorAll('.raj-slide-image-wrapper');
                let nextIndex = (currentIndex + 1) % slidesData.length;

                // Ensure Next slide is ready at Right (Enter)
                if (slides[nextIndex].classList.contains('slide-exit')) {
                    slides[nextIndex].style.transition = 'none';
                    slides[nextIndex].classList.remove('slide-exit');
                    slides[nextIndex].classList.add('slide-enter');
                    void slides[nextIndex].offsetWidth;
                    slides[nextIndex].style.transition = '';
                }

                // Current -> Exit (Left)
                slides[currentIndex].classList.remove('slide-active');
                slides[currentIndex].classList.add('slide-exit');

                // Next -> Active (Center)
                slides[nextIndex].classList.remove('slide-enter');
                slides[nextIndex].classList.add('slide-active');

                // Cleanup: Move others to Enter (Right) silently after transition
                setTimeout(() => {
                    slides.forEach((slide, idx) => {
                        if (idx !== currentIndex && idx !== nextIndex) {
                            slide.style.transition = 'none';
                            slide.classList.remove('slide-active', 'slide-exit');
                            slide.classList.add('slide-enter');
                            void slide.offsetWidth;
                            slide.style.transition = '';
                        }
                    });
                }, 1000);

                updateText(nextIndex);
                currentIndex = nextIndex;
            }

            function prevSlide() {
                const slides = document.querySelectorAll('.raj-slide-image-wrapper');
                let nextIndex = (currentIndex - 1 + slidesData.length) % slidesData.length;

                // Ensure Prev slide is ready at Left (Exit)
                if (slides[nextIndex].classList.contains('slide-enter')) {
                    slides[nextIndex].style.transition = 'none';
                    slides[nextIndex].classList.remove('slide-enter');
                    slides[nextIndex].classList.add('slide-exit');
                    void slides[nextIndex].offsetWidth;
                    slides[nextIndex].style.transition = '';
                }

                // Current -> Enter (Right)
                slides[currentIndex].classList.remove('slide-active');
                slides[currentIndex].classList.add('slide-enter');

                // Next (Previous) -> Active (Center)
                slides[nextIndex].classList.remove('slide-exit');
                slides[nextIndex].classList.add('slide-active');

                // Cleanup
                setTimeout(() => {
                    slides.forEach((slide, idx) => {
                        if (idx !== currentIndex && idx !== nextIndex) {
                            slide.style.transition = 'none';
                            slide.classList.remove('slide-active', 'slide-exit');
                            slide.classList.add('slide-enter');
                            void slide.offsetWidth;
                            slide.style.transition = '';
                        }
                    });
                }, 1000);

                updateText(nextIndex);
                currentIndex = nextIndex;
            }

            initSlider();
        });
    </script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html {
            overflow-x: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #FDFBF7;
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            /* Sticky Footer Setup */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            width: 100%;
        }

        /* Floating Navbar Component */
        floating-navbar {
            display: block;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        main {
            padding-top: 150px;
            padding-left: 20px;
            padding-right: 20px;
            max-width: 1200px;
            margin: 0 auto;
            flex: 1;
            /* Push footer down */
            width: 100%;
        }
    </style>
</head>

<body>
    <!-- Page Loader -->
    <div id="page-loader">
        <div class="loader-content">
            <div class="ball-wrapper">
                <div class="shadow"></div>
                <div class="ball"></div>
            </div>
            <div class="loader-text">LOADING</div>
        </div>
    </div>

    <floating-navbar></floating-navbar>

    <main>
        <section class="rajagiri-hero-section">
            <div class="rajagiri-hero-container">
                <!-- Background Watermarks -->
                <div class="raj-watermark-left">RAJAGIRI</div>
                <div class="raj-watermark-right">LEARN SERVE EXCEL</div>

                <!-- Top Left: Name -->
                <div class="raj-hero-name" id="heroName">
                    <!-- Dynamic Content -->
                </div>

                <!-- Top Right: Designation -->
                <div class="raj-hero-designation" id="heroDesignation">
                    <!-- Dynamic Content -->
                </div>

                <!-- Slider Images Container -->
                <div class="raj-slider-images" id="heroImages">
                    <!-- Images will be injected here or managed here -->
                </div>

                <!-- Navigation Arrows -->
                <svg xmlns="http://www.w3.org/2000/svg" class="raj-hero-prev" id="prevBtn" width="56.898" height="91"
                    viewBox="0 0 56.898 91">
                    <path d="M45.5,0,91,56.9,48.452,24.068,0,56.9Z" transform="translate(0 91) rotate(-90)"
                        fill="#fff" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" class="raj-hero-next" id="nextBtn" width="56.898" height="91"
                    viewBox="0 0 56.898 91">
                    <path d="M45.5,0,91,56.9,48.452,24.068,0,56.9Z" transform="translate(56.898) rotate(90)"
                        fill="#fff" />
                </svg>

                <!-- Bottom Right: Small Card -->
                <div class="raj-hero-card" id="heroCard">
                    <!-- Dynamic Content -->
                </div>

                <!-- Bottom Left: Placeholder -->
                <div class="raj-hero-placeholder">
                    <!-- Placeholder content -->
                </div>
            </div>
        </section>
    </main>

    <main-footer></main-footer>

    <script>
        // Loader Script
        window.addEventListener('load', () => {
            const loader = document.getElementById('page-loader');
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    document.body.classList.remove('loading');
                }, 500);
            }, 500);
        });
    </script>
</body>
